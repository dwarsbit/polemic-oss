packages:
  - packages/*

# Versions shared across the workspace. A package asks for one with "catalog:".
catalog:
  "@eslint/js": ^10.0.1
  "@next/eslint-plugin-next": ^16.4.6
  "@playwright/test": ^1.65.1
  "@sentry/cli": ^3.8.2
  "@sentry/vite-plugin": ^11.16.0
  "@types/chrome": ^0.3.7
  "@types/node": ^22.20.5
  "@vitest/coverage-v8": ^5.1.0
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.14.0
  happy-dom: ^21.0.4
  lefthook: ^2.2.2
  prettier: ^3.10.1
  turbo: ^2.11.11
  typescript: ~6.0.3
  typescript-eslint: ^8.72.2
  vitest: ^5.1.0

# Install scripts that don't run. The "prepare" script installs the Git hooks, so
# lefthook's own script isn't needed, and esbuild and sentry-cli ship their binaries as packages.
allowBuilds:
  "@sentry/cli": false
  esbuild: false
  lefthook: false

# Versions forced past a security advisory where a dependency pins an older one: vitest picks
# happy-dom as an optional peer, and serve pins compression. Drop an entry once the dependency
# asks for the fixed version itself.
overrides:
  happy-dom: ^21.0.4
  compression: ^1.8.2
